openapi: 3.1.0
info:
  title: GNAP server local owner extension
  version: 0.2.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  description: |-
    **Not part of RFC 9635 or RFC 9767.** A local stand-in for the resource
    owner's interaction channel, for development on one machine. The owner
    helper (`gnap-server owner ...`) holds the shared secret. The GNAP client
    never does. A production deployment replaces this with a real GNAP
    interaction mode and owner authentication on the server.

    Mounted only when the server starts with `GNAP_OWNER_SECRET` set.
servers:
  - url: http://127.0.0.1:4000
paths:
  /local/grants:
    get:
      operationId: listPendingGrants
      summary: List pending grants
      security:
        - ownerSignature: []
        - ownerSecret: []
      responses:
        '200':
          description: Pending grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingGrantList'
        '401':
          description: Missing or invalid owner signature or secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /local/grants/{id}:
    post:
      operationId: resolveGrant
      summary: Approve, optionally narrowing, or deny a pending grant
      security:
        - ownerSignature: []
        - ownerSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerResolution'
      responses:
        '200':
          description: The grant's new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResolutionResult'
        '400':
          description: Grant not pending, or access or audiences widen the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid owner signature or secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ownerSignature:
      type: apiKey
      in: header
      name: Signature
      description: RFC 9421 HTTP message signature by the owner key, with `Signature-Input` and, for bodies, `Content-Digest`.
    ownerSecret:
      type: http
      scheme: bearer
  schemas:
    AccessObject:
      type: object
      properties:
        type:
          type: string
      required: [type]
      additionalProperties: true
    PendingGrant:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        client_kid:
          type: string
        client_thumbprint:
          type: string
        client_display:
          type: object
          description: RFC 9635 `client.display` as the client stated it. Unverified.
          properties:
            name:
              type: string
            uri:
              type: string
          additionalProperties: false
        requested_access:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccessObject'
      required: [id, created_at, expires_at, client_kid, client_thumbprint, requested_access]
      additionalProperties: false
    PendingGrantList:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PendingGrant'
      required: [grants]
      additionalProperties: false
    OwnerResolution:
      discriminator:
        propertyName: decision
        mapping:
          deny: '#/components/schemas/DenyResolution'
          approve: '#/components/schemas/ApproveResolution'
      oneOf:
        - $ref: '#/components/schemas/DenyResolution'
        - $ref: '#/components/schemas/ApproveResolution'
    DenyResolution:
      type: object
      properties:
        decision:
          const: deny
      required: [decision]
      additionalProperties: false
    ApproveResolution:
      type: object
      properties:
        decision:
          const: approve
        access:
          type: array
          minItems: 1
          description: Narrowed access. Must be contained in the requested access.
          items:
            $ref: '#/components/schemas/AccessObject'
        audiences:
          type: array
          description: Resource server ids. Must be able to serve the approved access.
          items:
            type: string
      required: [decision]
      additionalProperties: false
    OwnerResolutionResult:
      type: object
      properties:
        state:
          type: string
          enum: [approved, denied]
      required: [state]
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              const: invalid_request
            description:
              type: string
          required: [code]
          additionalProperties: false
      required: [error]
      additionalProperties: false
