openapi: 3.1.0
info:
  title: GNAP Authorization Server (constrained profile)
  version: 0.2.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  summary: An RFC-conformant GNAP authorization server profile
  description: |-
    Implements the parts of [RFC 9635](https://www.rfc-editor.org/rfc/rfc9635)
    and [RFC 9767](https://www.rfc-editor.org/rfc/rfc9767) listed below. This
    is a constrained profile, not full GNAP. The server is generic over the
    access object type: each `type` is handled by a registered handler that
    parses it and decides containment. The server itself knows no type.

    Every request is signed with the `httpsig` proofing method (RFC 9635
    section 7.3.1, RFC 9421, RFC 9530). The signature covers `@method`,
    `@target-uri`, `content-digest` when a body is present and
    `authorization` when present, with parameters `created`, `nonce`,
    `keyid` equal to the JWK `kid`, and `tag="gnap"`. Ed25519 only.

    **Supported**
    - client key by value: Ed25519 JWK with `kid` and `alg: EdDSA`
    - one `access_token` request object with access objects of registered types
    - asynchronous authorization (RFC 9635 section 1.6.4): the response carries
      `continue` with `wait`, never `interact`
    - polling continuation with a stable continuation token while pending
    - token revocation with the token management access token
    - resource server introspection with a registry of resource servers and
      per-token audiences

    **Not supported**
    - key references, other curves, JWS or MTLS proofing
    - multiple access token requests
    - the `bearer` and `durable` flags, refused with `invalid_flag`
    - reference strings in `access`, refused with `invalid_request`
    - any `interact` start or finish mode
    - continuation with an updated request, token rotation
    - `subject` information, resource registration

    All URIs returned in `continue.uri` and `manage.uri` are absolute, built
    from the configured issuer.
servers:
  - url: http://127.0.0.1:4000
    description: Local development. Loopback HTTP is non-conformant; a conformance claim requires HTTPS.
tags:
  - name: grant
    description: Grant negotiation (RFC 9635)
  - name: token
    description: Token management (RFC 9635 section 6)
  - name: introspection
    description: Resource server introspection (RFC 9767)
paths:
  /:
    post:
      summary: Grant request
      operationId: grant
      tags: [grant]
      security: []
      description: |-
        RFC 9635 section 2. Signed with the key in `client.key`. The
        decision step either issues a token, denies, or leaves the grant
        pending. Pending returns `continue` only. The client polls the
        continuation URI after `wait` seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '200':
          description: A token was issued, or the grant is pending and `continue` is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
        '400':
          description: Malformed request, unsupported flag (`invalid_flag`), or an access item that no handler accepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature did not verify against `client.key`, or `client.key` is not the signing key (`invalid_client`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The decision step denied the request (`request_denied`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
  /continue/{id}:
    post:
      summary: Continue a grant request
      operationId: continue
      tags: [grant]
      description: |-
        RFC 9635 section 5. Signed with the client key bound to the grant.
        The continuation access token is presented in
        `Authorization: GNAP <value>`. No body. Pending responses retain the
        presented continuation token. Before `wait` elapses the response is
        `too_fast` and the credential is kept. After a final state the credential is gone and any further
        call is `invalid_continuation`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - gnap: []
      responses:
        '200':
          description: Still pending with `continue`, or the issued token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
        '400':
          description: '`invalid_continuation` or `too_fast` (with `Retry-After`).'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature did not verify against the bound key, or no continuation token presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The owner denied the grant (`user_denied`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
  /token/{id}:
    delete:
      summary: Revoke an access token
      operationId: revokeToken
      tags: [token]
      description: |-
        RFC 9635 section 6.2. Signed with the bound client key. The token
        management access token from `manage.access_token`, not the access
        token itself, is presented in `Authorization: GNAP <value>`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - gnap: []
      responses:
        '204':
          description: Revoked.
        '401':
          description: Wrong key, wrong token, unknown token, or already revoked (`invalid_client`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
  /introspect:
    post:
      summary: Token introspection
      operationId: introspect
      tags: [introspection]
      security: []
      description: |-
        RFC 9767 section 3.3. Signed with the key registered for
        `resource_server`. A token is active only when it is unexpired,
        not revoked, and the calling resource server is among the token's
        audiences. An inactive response carries only `active: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
      responses:
        '200':
          description: Introspection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unknown resource server or signature failure (`invalid_resource_server`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The requested `access` has a type this resource server may not introspect (`invalid_access`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
components:
  securitySchemes:
    gnap:
      type: http
      scheme: GNAP
      description: '`Authorization: GNAP <token>`, the request also carrying an httpsig signature.'
  responses:
    PayloadTooLarge:
      description: The request body exceeds the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Overloaded:
      description: The replay cache or pending-grant store is full. Nothing was accepted.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GrantRequest:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/AccessTokenRequest'
        client:
          $ref: '#/components/schemas/ClientInstance'
        interact:
          type: object
          description: Accepted for shape compatibility and ignored. This profile uses asynchronous authorization.
        subject:
          type: object
          description: Accepted and ignored.
      required: [access_token, client]
      additionalProperties: false
    AccessTokenRequest:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Access'
        label:
          type: string
          description: Accepted for a single token request but not echoed in the response.
          example: build-agent-token
        flags:
          type: array
          items:
            type: string
            enum: [bearer, durable]
          description: Any flag is refused with `invalid_flag`.
      required: [access]
      additionalProperties: false
    Access:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/AccessObject'
    AccessObject:
      type: object
      description: RFC 9635 section 8. `type` selects the registered handler, which defines the remaining fields.
      properties:
        type:
          type: string
      required: [type]
      additionalProperties: true
    ClientInstance:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/KeyObject'
        class_id:
          type: string
        display:
          type: object
          properties:
            name:
              type: string
            uri:
              type: string
            logo_uri:
              type: string
          additionalProperties: false
      required: [key]
      additionalProperties: false
    KeyObject:
      type: object
      properties:
        proof:
          oneOf:
            - type: string
              enum: [httpsig]
            - type: object
              properties:
                method:
                  type: string
                  enum: [httpsig]
                alg:
                  type: string
                  enum: [ed25519]
                content-digest-alg:
                  type: string
                  enum: [sha-256]
              required: [method]
              additionalProperties: false
        jwk:
          $ref: '#/components/schemas/Ed25519PublicJwk'
      required: [proof, jwk]
      additionalProperties: false
    Ed25519PublicJwk:
      type: object
      properties:
        kid:
          type: string
          minLength: 1
        alg:
          type: string
          enum: [EdDSA]
        use:
          type: string
          enum: [sig]
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      required: [kid, alg, kty, crv, x]
      additionalProperties: false
    GrantResponse:
      description: Exactly one of `access_token` or `continue`.
      oneOf:
        - $ref: '#/components/schemas/IssuedGrantResponse'
        - $ref: '#/components/schemas/PendingGrantResponse'
    IssuedGrantResponse:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/AccessToken'
      required: [access_token]
      additionalProperties: false
    PendingGrantResponse:
      type: object
      properties:
        continue:
          $ref: '#/components/schemas/Continue'
      required: [continue]
      additionalProperties: false
    AccessToken:
      type: object
      properties:
        value:
          type: string
        access:
          $ref: '#/components/schemas/Access'
        expires_in:
          type: integer
          minimum: 1
        manage:
          $ref: '#/components/schemas/TokenManagement'
      required: [value, access, expires_in, manage]
      additionalProperties: false
    TokenManagement:
      type: object
      description: RFC 9635 section 3.2.1. `access_token.value` is the token management access token, distinct from the access token and bound to the client key.
      properties:
        uri:
          type: string
          format: uri
        access_token:
          type: object
          properties:
            value:
              type: string
          required: [value]
          additionalProperties: false
      required: [uri, access_token]
      additionalProperties: false
    Continue:
      type: object
      description: RFC 9635 section 3.1.
      properties:
        uri:
          type: string
          format: uri
        wait:
          type: integer
          minimum: 0
        access_token:
          type: object
          properties:
            value:
              type: string
          required: [value]
          additionalProperties: false
      required: [uri, wait, access_token]
      additionalProperties: false
    IntrospectionRequest:
      type: object
      description: RFC 9767 section 3.3.
      properties:
        access_token:
          type: string
          minLength: 1
        proof:
          type: string
          enum: [httpsig]
        resource_server:
          oneOf:
            - type: string
              description: Registered resource server identifier.
              minLength: 1
            - type: object
              properties:
                key:
                  $ref: '#/components/schemas/KeyObject'
              required: [key]
              additionalProperties: false
        access:
          $ref: '#/components/schemas/Access'
      required: [access_token, resource_server]
      additionalProperties: false
    IntrospectionResponse:
      description: When `active` is false no other field is present.
      oneOf:
        - type: object
          properties:
            active:
              const: false
          required: [active]
          additionalProperties: false
        - type: object
          properties:
            active:
              const: true
            access:
              $ref: '#/components/schemas/Access'
            key:
              $ref: '#/components/schemas/KeyObject'
            iss:
              type: string
              format: uri
              description: Grant endpoint URL of the issuing server.
            exp:
              type: integer
            iat:
              type: integer
          required: [active, access, iss]
          additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_client
                - invalid_interaction
                - invalid_flag
                - invalid_rotation
                - key_rotation_not_supported
                - invalid_continuation
                - user_denied
                - request_denied
                - unknown_user
                - unknown_interaction
                - too_fast
                - too_many_attempts
                - invalid_resource_server
                - invalid_access
            description:
              type: string
          required: [code]
          additionalProperties: false
      required: [error]
      additionalProperties: false
