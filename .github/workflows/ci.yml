name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the specification
        run: pnpm generate:check
      - name: Specification lint
        run: pnpm lint:specs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          CI: 'true'
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-node-${{ matrix.node }}
          path: reports/junit.xml
          if-no-files-found: ignore
